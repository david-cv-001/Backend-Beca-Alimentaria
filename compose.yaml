services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: beca-alimentaria-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: beca_alimentaria
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d beca_alimentaria"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
