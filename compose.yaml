services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: beca-alimentaria-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: beca_alimentaria
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d beca_alimentaria"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: beca-alimentaria-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_NAME: backend-beca-alimentaria
      ENVIRONMENT: dev
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/beca_alimentaria
      JWT_SECRET_KEY: change-me-in-production-min-32-chars
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "480"
      CORS_ORIGINS: http://localhost:4200
      FIRST_SUPERADMIN_USERNAME: superadmin
      FIRST_SUPERADMIN_EMAIL: superadmin@beca.com
      FIRST_SUPERADMIN_PASSWORD: admin123
    ports:
      - "8080:8080"
    command: >
      sh -c "uv run alembic upgrade head &&
             uv run uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload"
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./scripts:/app/scripts

volumes:
  postgres_data:
